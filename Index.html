<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Leily | لايلي</title>

    <style>

        :root {
            --pink-main: #f8dfe5;
            --pink-soft: #fcecef;
            --pink-light: #fff5f7;
            --pink-dark: #c98999;

            --cream: #fffaf5;
            --cream-dark: #f7eee7;

            --white: #ffffff;

            --text-main: #4d4144;
            --text-soft: #8b7b80;
            --border: #eee2e4;

            --shadow-soft: 0 4px 18px rgba(92, 67, 73, 0.07);
            --shadow-card: 0 5px 20px rgba(92, 67, 73, 0.08);

            --radius-small: 12px;
            --radius-medium: 18px;
            --radius-large: 24px;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--cream);
            color: var(--text-main);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        img {
            display: block;
            width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           APP
           ========================================================= */

        .app {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--cream);
            padding-bottom: 90px;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 250, 245, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 15px 10px;
            border-bottom: 1px solid rgba(238, 226, 228, 0.7);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #665258;
        }

        .logo span {
            color: inherit;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-button {
            height: 38px;
            padding: 0 12px;
            border-radius: 20px;
            background: var(--white);
            color: #75656a;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
            font-size: 12px;
            font-weight: 600;
        }

        .language-button:active {
            transform: scale(0.95);
        }

        .saved-header-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--white);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #9d747f;
            transition: transform 0.2s ease;
        }

        .saved-header-button:active {
            transform: scale(0.9);
        }


        /* =========================================================
           SEARCH
           ========================================================= */

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--white);
            padding: 0 48px 0 18px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            box-shadow: var(--shadow-soft);
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--pink-main);
            box-shadow: 0 0 0 3px rgba(248, 223, 229, 0.35);
        }

        .search-input::placeholder {
            color: #b1a4a8;
        }

        .search-icon {
            position: absolute;
            right: 17px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 19px;
            color: #a18d93;
            pointer-events: none;
        }


        /* =========================================================
           CATEGORIES
           ========================================================= */

        .categories-wrapper {
            overflow-x: auto;
            scrollbar-width: none;
            padding-top: 12px;
            padding-bottom: 3px;
        }

        .categories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            width: max-content;
        }

        .category-button {
            padding: 9px 15px;
            border-radius: 20px;
            background: var(--white);
            color: var(--text-soft);
            border: 1px solid var(--border);
            font-size: 13px;
            white-space: nowrap;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .category-button.active {
            background: var(--pink-main);
            color: #6b4f57;
            border-color: var(--pink-main);
            font-weight: 600;
        }

        .category-button:active {
            transform: scale(0.96);
        }


        /* =========================================================
           MAIN
           ========================================================= */

        .main {
            padding: 18px 14px 0;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #5a4b50;
        }

        .section-subtitle {
            font-size: 12px;
            color: var(--text-soft);
        }


        /* =========================================================
           FEATURED
           ========================================================= */

        .featured-section {
            margin-bottom: 24px;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 11px;
        }

        .featured-card {
            position: relative;
            background: var(--white);
            border-radius: var(--radius-medium);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            animation: featuredFade 0.45s ease;
        }

        .featured-card.pinned {
            border: 2px solid var(--pink-main);
        }

        .featured-card .product-image-container {
            aspect-ratio: 0.82;
        }

        .featured-badge {
            position: absolute;
            top: 9px;
            right: 9px;
            z-index: 5;
            padding: 5px 9px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.92);
            color: #a56e7d;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        .pinned-badge {
            position: absolute;
            top: 9px;
            left: 9px;
            z-index: 5;
            padding: 5px 9px;
            border-radius: 15px;
            background: var(--pink-main);
            color: #6d5058;
            font-size: 10px;
            font-weight: 700;
        }

        @keyframes featuredFade {

            from {
                opacity: 0.25;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           PRODUCTS
           ========================================================= */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 11px;
        }

        .product-card {
            position: relative;
            min-width: 0;
            background: var(--white);
            border-radius: var(--radius-medium);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.985);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 0.82;
            background: var(--pink-light);
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .heart-button {
            position: absolute;
            top: 9px;
            left: 9px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.93);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #987b83;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            z-index: 4;
            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .heart-button.saved {
            color: #d4778b;
        }

        .heart-button:active {
            transform: scale(0.82);
        }

        .product-info {
            padding: 10px 10px 12px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            color: #514449;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 14px;
            font-weight: 700;
            color: #a96f7c;
            margin-bottom: 5px;
        }

        .seller-name {
            font-size: 11px;
            color: var(--text-soft);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {
            display: none;
            text-align: center;
            padding: 45px 20px;
            color: var(--text-soft);
        }

        .empty-state.show {
            display: block;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
            opacity: 0.65;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .empty-text {
            font-size: 13px;
        }


        /* =========================================================
           BOTTOM NAVIGATION
           ========================================================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 700px;
            height: 68px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-button {
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #9b8b90;
            font-size: 10px;
        }

        .nav-icon {
            font-size: 20px;
            line-height: 1;
        }

        .nav-button.active {
            color: #a66d7c;
            font-weight: 600;
        }


        /* =========================================================
           TOAST
           ========================================================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translateX(-50%) translateY(20px);
            background: #5b4b51;
            color: white;
            padding: 10px 17px;
            border-radius: 22px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            z-index: 500;
            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 550px) {

            .featured-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .products-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 360px) {

            .app {
                padding-bottom: 85px;
            }

            .main {
                padding-left: 10px;
                padding-right: 10px;
            }

            .products-grid,
            .featured-grid {
                gap: 9px;
            }

            .product-info {
                padding: 8px;
            }

            .product-name {
                font-size: 13px;
            }

            .product-price {
                font-size: 13px;
            }
        }

    </style>
</head>


<body>

    <div class="app">


        <!-- =====================================================
             HEADER
             ====================================================== -->

        <header class="header">

            <div class="top-row">

                <div class="logo">
                    Leily
                </div>


                <div class="top-actions">

                    <button
                        class="language-button"
                        id="languageButton"
                        aria-label="Change language">
                        English
                    </button>


                    <button
                        class="saved-header-button"
                        id="savedHeaderButton"
                        aria-label="المحفوظات">
                        ♡
                    </button>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="search-container">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    id="searchInput"
                    class="search-input"
                    type="search"
                    placeholder="ابحثي عن تنورة، ثوب، حذاء، حقيبة..."
                    autocomplete="off"
                    enterkeyhint="search"
                >

            </div>


            <!-- CATEGORIES -->

            <div class="categories-wrapper">

                <div class="categories">

                    <button
                        class="category-button active"
                        data-category="all">
                        الكل
                    </button>

                    <button
                        class="category-button"
                        data-category="skirts">
                        تنورات
                    </button>

                    <button
                        class="category-button"
                        data-category="shoes">
                        أحذية
                    </button>

                    <button
                        class="category-button"
                        data-category="jeans">
                        جينز
                    </button>

                    <button
                        class="category-button"
                        data-category="bags">
                        حقائب
                    </button>

                    <button
                        class="category-button"
                        data-category="pants">
                        سراويل
                    </button>

                    <button
                        class="category-button"
                        data-category="kids">
                        أطفال
                    </button>

                    <button
                        class="category-button"
                        data-category="accessories">
                        إكسسوارات
                    </button>

                </div>

            </div>

        </header>


        <!-- =====================================================
             MAIN
             ====================================================== -->

        <main class="main">


            <!-- FEATURED -->

            <section class="featured-section">

                <div class="section-heading">

                    <div>

                        <h2
                            class="section-title"
                            id="featuredTitle">
                            مميز لكِ ✨
                        </h2>

                        <p
                            class="section-subtitle"
                            id="featuredSubtitle">
                            منتجات مميزة من البائعات
                        </p>

                    </div>

                    <span
                        class="section-subtitle"
                        id="featuredCounter">
                    </span>

                </div>


                <div
                    class="featured-grid"
                    id="featuredGrid">
                </div>

            </section>


            <!-- NORMAL PRODUCTS -->

            <section>

                <div class="section-heading">

                    <h2
                        class="section-title"
                        id="productsTitle">
                        اكتشفي المنتجات
                    </h2>

                    <span
                        class="section-subtitle"
                        id="productCount">
                    </span>

                </div>


                <div
                    class="products-grid"
                    id="productsGrid">
                </div>


                <div
                    class="empty-state"
                    id="emptyState">
