<!DOCTYPE html>

    <style>
        /* =========================================================
           LEILY - GLOBAL VARIABLES
           ========================================================= */

        :root {
            --pink-main: #f8dfe5;
            --pink-soft: #fcecef;
            --pink-light: #fff5f7;
            --pink-dark: #c98999;

            --cream: #fffaf5;
            --cream-dark: #f7eee7;

            --white: #ffffff;

            --text-main: #4d4144;
            --text-soft: #8b7b80;
            --border: #eee2e4;

            --shadow-soft: 0 4px 18px rgba(92, 67, 73, 0.07);
            --shadow-card: 0 5px 20px rgba(92, 67, 73, 0.08);

            --radius-small: 12px;
            --radius-medium: 18px;
            --radius-large: 24px;
        }


        /* =========================================================
           RESET
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--cream);
            color: var(--text-main);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        img {
            display: block;
            width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           APP CONTAINER
           ========================================================= */

        .app {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--cream);
            padding-bottom: 90px;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 250, 245, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 15px 10px;
            border-bottom: 1px solid rgba(238, 226, 228, 0.7);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #665258;
        }

        .logo span {
            color: var(--pink-dark);
        }

        .saved-header-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--white);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #9d747f;
            transition: transform 0.2s ease;
        }

        .saved-header-button:active {
            transform: scale(0.9);
        }


        /* =========================================================
           SEARCH
           ========================================================= */

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--white);
            padding: 0 48px 0 18px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            box-shadow: var(--shadow-soft);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--pink-main);
            box-shadow: 0 0 0 3px rgba(248, 223, 229, 0.35);
        }

        .search-input::placeholder {
            color: #b1a4a8;
        }

        .search-icon {
            position: absolute;
            right: 17px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 19px;
            color: #a18d93;
            pointer-events: none;
        }


        /* =========================================================
           CATEGORIES
           ========================================================= */

        .categories-wrapper {
            overflow-x: auto;
            scrollbar-width: none;
            padding-top: 12px;
            padding-bottom: 3px;
        }

        .categories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            width: max-content;
        }

        .category-button {
            padding: 9px 15px;
            border-radius: 20px;
            background: var(--white);
            color: var(--text-soft);
            border: 1px solid var(--border);
            font-size: 13px;
            white-space: nowrap;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .category-button.active {
            background: var(--pink-main);
            color: #6b4f57;
            border-color: var(--pink-main);
            font-weight: 600;
        }

        .category-button:active {
            transform: scale(0.96);
        }


        /* =========================================================
           MAIN
           ========================================================= */

        .main {
            padding: 18px 14px 0;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #5a4b50;
        }

        .section-subtitle {
            font-size: 12px;
            color: var(--text-soft);
        }


        /* =========================================================
           FEATURED SECTION
           ========================================================= */

        .featured-section {
            margin-bottom: 24px;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 11px;
        }

        .featured-card {
            position: relative;
            background: var(--white);
            border-radius: var(--radius-medium);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            animation: featuredFade 0.45s ease;
        }

        .featured-card.pinned {
            border: 2px solid var(--pink-main);
        }

        .featured-card .product-image-container {
            aspect-ratio: 0.82;
        }

        .featured-card.pinned .product-image-container {
            aspect-ratio: 0.82;
        }

        .featured-badge {
            position: absolute;
            top: 9px;
            right: 9px;
            z-index: 5;
            padding: 5px 9px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.92);
            color: #a56e7d;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        .pinned-badge {
            position: absolute;
            top: 9px;
            left: 9px;
            z-index: 5;
            padding: 5px 9px;
            border-radius: 15px;
            background: var(--pink-main);
            color: #6d5058;
            font-size: 10px;
            font-weight: 700;
        }

        @keyframes featuredFade {
            from {
                opacity: 0.25;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           PRODUCTS GRID
           ========================================================= */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 11px;
        }

        .product-card {
            position: relative;
            min-width: 0;
            background: var(--white);
            border-radius: var(--radius-medium);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.985);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 0.82;
            background: var(--pink-light);
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .heart-button {
            position: absolute;
            top: 9px;
            left: 9px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.93);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #987b83;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            z-index: 4;
            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .heart-button.saved {
            color: #d4778b;
        }

        .heart-button:active {
            transform: scale(0.82);
        }

        .product-info {
            padding: 10px 10px 12px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            color: #514449;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 14px;
            font-weight: 700;
            color: #a96f7c;
            margin-bottom: 5px;
        }

        .seller-name {
            font-size: 11px;
            color: var(--text-soft);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {
            display: none;
            text-align: center;
            padding: 45px 20px;
            color: var(--text-soft);
        }

        .empty-state.show {
            display: block;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
            opacity: 0.65;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .empty-text {
            font-size: 13px;
        }


        /* =========================================================
           BOTTOM NAVIGATION
           ========================================================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 700px;
            height: 68px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-button {
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #9b8b90;
            font-size: 10px;
        }

        .nav-icon {
            font-size: 20px;
            line-height: 1;
        }

        .nav-button.active {
            color: #a66d7c;
            font-weight: 600;
        }


        /* =========================================================
           TOAST
           ========================================================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translateX(-50%) translateY(20px);
            background: #5b4b51;
            color: white;
            padding: 10px 17px;
            border-radius: 22px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            z-index: 500;
            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 550px) {

            .featured-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .products-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 360px) {

            .app {
                padding-bottom: 85px;
            }

            .main {
                padding-left: 10px;
                padding-right: 10px;
            }

            .products-grid,
            .featured-grid {
                gap: 9px;
            }

            .product-info {
                padding: 8px;
            }

            .product-name {
                font-size: 13px;
            }

            .product-price {
                font-size: 13px;
            }
        }
    </style>
</head>

                    "bracelet"
                ],
                image: "https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=700&q=75"
            },

            {
                id: "product-9",
                name: "ملابس أطفال وردية",
                price: 2300,
                seller: "Little Moon",
                category: "kids",
                keywords: [
                    "أطفال",
                    "ملابس أطفال",
                    "وردي",
                    "kids"
                ],
                image: "https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=700&q=75"
            },

            {
                id: "product-10",
                name: "حقيبة سوداء صغيرة",
                price: 2900,
                seller: "Black Pearl",
                category: "bags",
                keywords: [
                    "حقيبة",
                    "حقيبة سوداء",
                    "black bag"
                ],
                image: "https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=700&q=75"
            },

            {
                id: "product-11",
                name: "تنورة جينز قصيرة",
                price: 2700,
                seller: "Denim Girl",
                category: "skirts",
                keywords: [
                    "تنورة",
                    "جينز",
                    "تنورة جينز"
                ],
                image: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=700&q=75"
            },

            {
                id: "product-12",
                name: "سروال بيج مريح",
                price: 3000,
                seller: "Simple Wear",
                category: "pants",
                keywords: [
                    "سروال",
                    "بنطال",
                    "بيج"
                ],
                image: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=700&q=75"
            }

        ];


        /* =========================================================
           STATE
           ========================================================= */

        let selectedCategory = "all";

        let searchQuery = "";

        let savedProducts = loadSavedProducts();

        let featuredRotationIndex = 0;


        /* =========================================================
           LOCAL STORAGE
           ========================================================= */

        function loadSavedProducts() {

            try {

                const saved = localStorage.getItem("leily_saved_products");

                if (!saved) {
                    return [];
                }

                const parsed = JSON.parse(saved);

                if (!Array.isArray(parsed)) {
                    return [];
                }

                return parsed;

            } catch (error) {

                console.log("تعذر تحميل المحفوظات:", error);

                return [];
            }
        }


        function saveSavedProducts() {

            try {

                localStorage.setItem(
                    "leily_saved_products",
                    JSON.stringify(savedProducts)
                );

            } catch (error) {

                console.log("تعذر حفظ المنتجات:", error);
            }
        }


        /* =========================================================
           HELPERS
           ========================================================= */

        function formatPrice(price) {

            return Number(price).toLocaleString("ar-DZ") + " دج";
        }


        function isProductSaved(productId) {

            return savedProducts.includes(productId);
        }


        function getAllProducts() {

            return [
                ...featuredProducts,
                ...normalProducts
            ];
        }


        function findProductById(productId) {

            return getAllProducts().find(
                product => product.id === productId
            );
        }


        /* =========================================================
           HEART / SAVE SYSTEM
           ========================================================= */

        function toggleSaved(productId) {

            const product = findProductById(productId);

            if (!product) {
                return;
            }


            const alreadySaved = isProductSaved(productId);


            if (alreadySaved) {

                savedProducts = savedProducts.filter(
                    id => id !== productId
                );

                showToast("تمت إزالة المنتج من المحفوظات");

            } else {

                savedProducts.push(productId);

                showToast("تم حفظ المنتج ♡");
            }


            saveSavedProducts();

            renderFeatured();

            renderProducts();
        }


        /* =========================================================
           CREATE PRODUCT CARD
           ========================================================= */

        function createProductCard(product) {

            const saved = isProductSaved(product.id);


            return `

                <article
                    class="product-card"
                    data-product-id="${product.id}"
                >

                    <div class="product-image-container">

                        <img
                            class="product-image"
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                        <button
                            class="heart-button ${saved ? "saved" : ""}"
                            data-save-id="${product.id}"
                            aria-label="حفظ المنتج"
                        >
                            ${saved ? "♥" : "♡"}
                        </button>

                    </div>


                    <div class="product-info">

                        <div class="product-name">
                            ${product.name}
                        </div>

                        <div class="product-price">
                            ${formatPrice(product.price)}
                        </div>

                        <div class="seller-name">
                            ${product.seller}
                        </div>

                    </div>

                </article>

            `;
        }


        /* =========================================================
           FEATURED ROTATION
           ========================================================= */

        function getRotatingFeaturedProducts() {

            const pinnedProducts = featuredProducts.filter(
                product => product.pinned === true
            );

            const rotatingProducts = featuredProducts.filter(
                product => product.pinned !== true
            );


            /*
                إذا لم يكن لدينا منتجات مثبتة،
                نعرض المنتجات كلها بشكل عادي.
            */

            if (pinnedProducts.length === 0) {

                return rotateArray(
                    rotatingProducts,
                    featuredRotationIndex
                );
            }


            /*
                المنتج المثبت دائماً في البداية.

                بقية المنتجات تتغير أماكنها
                بالتدوير.
            */

            const rotated = rotateArray(
                rotatingProducts,
                featuredRotationIndex
            );


            return [
                ...pinnedProducts,
                ...rotated.slice(0, 2)
            ];
        }


        function rotateArray(array, startIndex) {

            if (array.length === 0) {
                return [];
            }

            const normalizedIndex =
                startIndex % array.length;

            return [
                ...array.slice(normalizedIndex),
                ...array.slice(0, normalizedIndex)
            ];
        }


        /* =========================================================
           RENDER FEATURED
           ========================================================= */

        function renderFeatured() {

            const featuredGrid =
                document.getElementById("featuredGrid");

            const featuredCounter =
                document.getElementById("featuredCounter");


            const visibleFeatured =
                getRotatingFeaturedProducts();


            /*
                في حالة وجود 1 منتج مثبت:
                المركز الأول = المنتج المثبت.

                المركزان الثاني والثالث =
                منتجات تتغير كل دورة.
            */

            featuredGrid.innerHTML =
                visibleFeatured
                    .map(product => {

                        const saved =
                            isProductSaved(product.id);

                        const pinned =
                            product.pinned === true;


                        return `

                            <article
                                class="featured-card ${pinned ? "pinned" : ""}"
                                data-product-id="${product.id}"
                            >

                                <div class="product-image-container">

                                    <img
                                        class="product-image"
                                        src="${product.image}"
                                        alt="${product.name}"
                                    >


                                    <span class="featured-badge">
                                        ✨ مميز
                                    </span>


                                    ${
                                        pinned
                                            ? `
                                                <span class="pinned-badge">
                                                    📌 ثابت
                                                </span>
                                              `
                                            : ""
                                    }


                                    <button
                                        class="heart-button ${saved ? "saved" : ""}"
                                        data-save-id="${product.id}"
                                        aria-label="حفظ المنتج"
                                    >
                                        ${saved ? "♥" : "♡"}
                                    </button>

                                </div>


                                <div class="product-info">

                                    <div class="product-name">
                                        ${product.name}
                                    </div>

                                    <div class="product-price">
                                        ${formatPrice(product.price)}
                                    </div>

                                    <div class="seller-name">
                                        ${product.seller}
                                    </div>

                                </div>

                            </article>

                        `;

                    })
                    .join("");


            const rotatingCount =
                featuredProducts.filter(
                    product => product.pinned !== true
                ).length;


            featuredCounter.textContent =
                rotatingCount > 2
                    ? "تتغير تلقائياً ✨"
                    : "";
        }


        /* =========================================================
           FILTER PRODUCTS
           ========================================================= */

        function getFilteredProducts() {

            let products = [...normalProducts];


            /* CATEGORY FILTER */

            if (selectedCategory !== "all") {

                products = products.filter(
                    product =>
                        product.category === selectedCategory
                );
            }


            /* SEARCH FILTER */

            if (searchQuery.trim() !== "") {

                const query =
                    searchQuery
                        .trim()
                        .toLowerCase();


                products = products.filter(product => {

                    const searchableText = [

                        product.name,

                        product.seller,

                        product.category,

                        ...product.keywords

                    ]
                        .join(" ")
                        .toLowerCase();


                    return searchableText.includes(query);
                });
            }


            return products;
        }


        /* =========================================================
           RENDER NORMAL PRODUCTS
           ========================================================= */

        function renderProducts() {

            const productsGrid =
                document.getElementById("productsGrid");

            const emptyState =
                document.getElementById("emptyState");

            const productCount =
                document.getElementById("productCount");


            const products =
                getFilteredProducts();


            productCount.textContent =
                `${products.length} منتج`;


            if (products.length === 0) {

                productsGrid.innerHTML = "";

                emptyState.classList.add("show");

                return;
            }


            emptyState.classList.remove("show");


            productsGrid.innerHTML =
                products
                    .map(product => createProductCard(product))
                    .join("");
        }


        /* =========================================================
           SEARCH
           ========================================================= */

        const searchInput =
            document.getElementById("searchInput");


        searchInput.addEventListener(
            "input",
            function(event) {

                searchQuery =
                    event.target.value;

                renderProducts();
            }
        );


        /* =========================================================
           CATEGORY BUTTONS
           ========================================================= */

        const categoryButtons =
            document.querySelectorAll(".category-button");


        categoryButtons.forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    categoryButtons.forEach(
                        item =>
                            item.classList.remove("active")
                    );


                    this.classList.add("active");


                    selectedCategory =
                        this.dataset.category;


                    renderProducts();
                }
            );

        });


        /* =========================================================
           SAVE BUTTONS
           EVENT DELEGATION
           ========================================================= */

        document.addEventListener(
            "click",
            function(event) {

                const saveButton =
                    event.target.closest("[data-save-id]");


                if (!saveButton) {
                    return;
                }


                const productId =
                    saveButton.dataset.saveId;


                toggleSaved(productId);
            }
        );


        /* =========================================================
           FEATURED AUTO ROTATION
           ========================================================= */

        function rotateFeatured() {

            const rotatingProducts =
                featuredProducts.filter(
                    product => product.pinned !== true
                );


            if (rotatingProducts.length <= 2) {
                return;
            }


            /*
                نزيد المؤشر.

                المنتج المثبت لا يتأثر.

                المنتجات الأخرى تتحرك إلى الأمام
                بالتتابع.
            */

            featuredRotationIndex =
                featuredRotationIndex + 1;


            renderFeatured();
        }


        /*
            التدوير كل 4 ثوانٍ.

            هذا مجرد اختبار للـ Mock Data.
            لاحقاً يمكن تغيير المدة أو طريقة
            اختيار المنتجات حسب نظام الإعلانات الحقيقي.
        */

        setInterval(
            rotateFeatured,
            4000
        );


        /* =========================================================
           TOAST
           ========================================================= */

        let toastTimeout;


        function showToast(message) {

            const toast =
                document.getElementById("toast");


            toast.textContent = message;

            toast.classList.add("show");


            clearTimeout(toastTimeout);


            toastTimeout =
                setTimeout(
                    function() {

                        toast.classList.remove("show");

                    },
                    2200
                );
        }


        /* =========================================================
           SAVED HEADER BUTTON
           ========================================================= */

        const savedHeaderButton =
            document.getElementById("savedHeaderButton");


        savedHeaderButton.addEventListener(
            "click",
            function() {

                const savedCount =
                    savedProducts.length;


                if (savedCount === 0) {

                    showToast(
                        "لا توجد منتجات محفوظة حتى الآن"
                    );

                    return;
                }


                showToast(
                    `لديكِ ${savedCount} منتج محفوظ`
                );
            }
        );


        /* =========================================================
           BOTTOM NAVIGATION
           ========================================================= */

        const navButtons =
            document.querySelectorAll(".nav-button");


        navButtons.forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    const nav =
                        this.dataset.nav;


                    navButtons.forEach(
                        item =>
                            item.classList.remove("active")
                    );


                    this.classList.add("active");


                    if (nav === "home") {

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                        return;
                    }


                    if (nav === "categories") {

                        document
                            .querySelector(".categories-wrapper")
                            .scrollIntoView({
                                behavior: "smooth"
                            });

                        return;
                    }


                    if (nav === "saved") {

                        if (savedProducts.length === 0) {

                            showToast(
                                "قائمة المحفوظات فارغة"
                            );

                            return;
                        }


                        showToast(
                            `لديكِ ${savedProducts.length} منتجات محفوظة`
                        );

                        return;
                    }


                    if (nav === "account") {

                        showToast(
                            "صفحة الحساب ستُبنى في المرحلة التالية"
                        );

                    }

                }
            );

        });


        /* =========================================================
           INITIAL RENDER
           ========================================================= */

        renderFeatured();

        renderProducts();


        /* =========================================================
           DEBUG HELPER
           ========================================================= */

        /*
            يمكنك فتح Console في المتصفح واستخدام:

            Leily.getSaved()

            لرؤية المنتجات المحفوظة.

            Leily.getFeatured()

            لرؤية المنتجات المميزة.

            هذه الأدوات لن تكون ضرورية في النسخة النهائية.
        */

        window.Leily = {

            getSaved: function() {
                return savedProducts;
            },

            getFeatured: function() {
                return featuredProducts;
            },

            getProducts: function() {
                return normalProducts;
            }

        };

    </script>

</body>
</html>
