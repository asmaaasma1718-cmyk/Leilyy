<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Leily</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pink: #f8dfe5;
            --pink-dark: #d99eae;
            --pink-soft: #fdf0f3;
            --cream: #fffaf5;
            --white: #ffffff;
            --beige: #f4ebe3;
            --text: #3f3838;
            --muted: #8b8080;
            --border: #eee1dc;
            --shadow: 0 5px 18px rgba(70, 45, 45, 0.08);
        }

        body {
            font-family: Arial, "Segoe UI", sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--cream);
        }

        /* Header */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 250, 245, 0.97);
            backdrop-filter: blur(12px);
            padding: 15px 15px 10px;
            border-bottom: 1px solid var(--border);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 13px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #4a4141;
            white-space: nowrap;
        }

        .logo span {
            color: #d99eae;
        }

        .language-button {
            background: var(--white);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            box-shadow: var(--shadow);
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .search-box {
            flex: 1;
            height: 46px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 0 13px;
            box-shadow: var(--shadow);
        }

        .search-icon {
            font-size: 19px;
            margin-inline-end: 8px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #aaa0a0;
        }

        .saved-button {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 15px;
            background: var(--white);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 21px;
            color: #b98292;
        }

        /* Categories */

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 2px 4px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            flex: 0 0 auto;
            padding: 9px 14px;
            border-radius: 20px;
            background: var(--white);
            color: #706666;
            border: 1px solid var(--border);
            font-size: 13px;
            white-space: nowrap;
        }

        .category.active {
            background: var(--pink);
            color: #5d484d;
            border-color: var(--pink);
            font-weight: bold;
        }

        /* Main */

        main {
            padding: 15px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 2px 13px;
        }

        .section-heading h2 {
            font-size: 18px;
            color: #443b3b;
        }

        .section-heading span {
            font-size: 12px;
            color: var(--muted);
        }

        /* Product Grid */

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            align-items: start;
        }

        .product-card {
            background: var(--white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid #f0e7e3;
            position: relative;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 0.82;
            background: var(--beige);
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .heart {
            position: absolute;
            top: 9px;
            inset-inline-end: 9px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            color: #ad7d89;
            font-size: 18px;
            z-index: 2;
        }

        .badge {
            position: absolute;
            top: 9px;
            inset-inline-start: 9px;
            padding: 5px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.92);
            color: #9d6979;
            font-size: 10px;
            font-weight: bold;
        }

        .product-info {
            padding: 11px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 800;
            color: #a66f7e;
            margin-bottom: 7px;
        }

        .seller {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--muted);
        }

        .verified {
            font-size: 12px;
        }

        /* Empty state */

        .empty {
            display: none;
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        /* Bottom navigation */

        .bottom-space {
            height: 80px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 700px;
            height: 67px;
            background: rgba(255, 250, 245, 0.97);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 90;
        }

        .nav-item {
            background: transparent;
            color: #8b8080;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
        }

        .nav-item .nav-icon {
            font-size: 21px;
        }

        .nav-item.active {
            color: #b77e8c;
            font-weight: bold;
        }

        /* Responsive */

        @media (min-width: 520px) {
            .product-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
    </style>
</head>

</div>
